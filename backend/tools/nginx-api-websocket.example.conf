# Ajuste para shared/nginx.conf (VPS) — Refugio API + WebSocket delivery
#
# Si usas: proxy_set_header Connection $connection_upgrade;
# entonces DEBES tener en http { } (no dentro de server { }):
#   map $http_upgrade $connection_upgrade { default upgrade; '' close; }
# Sin ese map, nginx suele NO arrancar (falla nginx -t).
#
# OPCIÓN RECOMENDADA (sin map): bloque WS antes de location /, igual que Reverb en tu mismo archivo.

# Refugio Backend API
server {
    listen 443 ssl;
    server_name api.datarefugio.gcbprojects.site;

    ssl_certificate /etc/letsencrypt/live/datarefugio.gcbprojects.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/datarefugio.gcbprojects.site/privkey.pem;

    large_client_header_buffers 4 32k;
    # Subidas agenda deportiva (slides/audio). Sin esto Nginx responde 413 (~1 MB por defecto).
    client_max_body_size 30m;

    location /api/delivery/ws {
        proxy_pass http://datarefugio_backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location / {
        proxy_pass http://datarefugio_backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
